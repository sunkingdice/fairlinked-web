{{ $style := .Get "style" | default "primary" -}}
{{ if eq $style "primary" -}}
<a href="{{ .Get "url" }}" style="display:inline-block;margin:0.6rem 0.5rem 0.6rem 0;padding:0.65rem 1.6rem;font-family:'Fira Mono',monospace;font-size:0.95rem;font-weight:500;color:#02376b;background:#fff;border:2px solid #fff;border-radius:6px;text-decoration:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.15);transition:background 0.2s,box-shadow 0.2s;" onmouseover="this.style.background='#e8e8e8'" onmouseout="this.style.background='#fff'">{{ .Get "text" }}</a>
{{- else -}}
<a href="{{ .Get "url" }}" style="display:inline-block;margin:0.6rem 0.5rem 0.6rem 0;padding:0.65rem 1.6rem;font-family:'Fira Mono',monospace;font-size:0.95rem;font-weight:500;color:#fff;background:transparent;border:2px solid rgba(255,255,255,0.5);border-radius:6px;text-decoration:none;cursor:pointer;transition:border-color 0.2s,background 0.2s;" onmouseover="this.style.borderColor='#fff';this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.borderColor='rgba(255,255,255,0.5)';this.style.background='transparent'">{{ .Get "text" }}</a>
{{- end }}
